# Dependabot opens a pull request when a dependency has an update or a known
# vulnerability. CI runs on each one, so an update that breaks a test shows red
# before it is merged. Security updates come as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: uv          # apps/api/uv.lock
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub         # apps/mobile/pubspec.lock
    directory: /apps/mobile
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dart-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }

  - package-ecosystem: docker      # base images in apps/api/Dockerfile
    directory: /apps/api
    schedule: { interval: monthly }
